name: Deploy

# Deploys to the VPS after CI passes on main. Disabled until the repository variable
# DEPLOY_ENABLED is set to "true" and the VPS_* secrets exist (see docs/deploy.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild api and web (the tunnel keeps running)
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR || '~/ai-market-intelligence' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -e
            cd "$(eval echo "$APP_DIR")"
            git pull --ff-only
            docker compose -f deploy/docker-compose.yml up -d --build api web
            docker compose -p ami ps
